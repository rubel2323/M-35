<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code and Care Tube</title>

    <!-- tailwind css -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header class="">
      <nav class="flex justify-between mx-auto max-w-11/12 py-3 border-b">
        <div class="logo">
          <img src="./resources/Logo.png" alt="" />
        </div>

        <div class="search">
          <label class="input">
            <svg
              class="h-[1em] opacity-50"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <g
                stroke-linejoin="round"
                stroke-linecap="round"
                stroke-width="2.5"
                fill="none"
                stroke="currentColor"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </g>
            </svg>
            <input type="search" required placeholder="Search" />
          </label>
        </div>

        <div class="sort">
          <button class="btn">sort</button>
        </div>
      </nav>
    </header>
    <nav id="displayCatagory" class="py-2 flex gap-2 justify-center"></nav>

    <!-- videos adding -->
    <main>
      <section
        id="videos"
        class="py-2 grid grid-cols-1 md:grid- lg:grid-cols-4 mx-auto"
      ></section>
    </main>
    <script src="./video.js"></script>
  </body>
</html>
